name: Build DesktopSplitter

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build via repo script
        shell: pwsh
        run: ./ci/build.ps1

      - name: Save build log to ci-logs branch
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ci-log.txt) {
            git config user.name "ci"
            git config user.email "ci@localhost"
            git checkout --orphan ci-logs-tmp
            git add -f ci-log.txt
            git commit -m "ci log"
            git push -f origin ci-logs-tmp:ci-logs
          }

      - name: Update rolling latest release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automatic cloud build. Unsigned development build - the
            installer will ask you to trust the development certificate.
          files: DesktopSplitterSetup-*.exe
